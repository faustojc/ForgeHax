import org.apache.tools.ant.filters.ReplaceTokens

buildscript {
  repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
  }
  dependencies {
    classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
  }
}

repositories {
  mavenCentral()
  maven { url "https://oss.sonatype.org/content/groups/public/" }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'idea'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

group 'com.matt.forgehax'
version project.property('forgehax.version')

archivesBaseName = "forgehax-" + project.property('forgehax.mc.version')

configurations.all {
  resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

sourceSets {
  schematica_api {
    compileClasspath += main.compileClasspath
  }

  main {
    compileClasspath += schematica_api.output
    // FML locates mcmod.info next to the classes in dev runs
    output.resourcesDir = output.classesDirs.singleFile
  }
}

minecraft {
  mappings channel: project.property('forgehax.mcp.channel'),
      version: "${project.property('forgehax.mcp.mapping')}-${project.property('forgehax.mcp.version')}"

  runs {
    client {
      workingDirectory project.file('run')
      property 'fml.coreMods.load', 'com.matt.forgehax.asm.ForgeHaxCoreMod'
    }

    server {
    }
  }
}

configurations {
  forgeUniversal
}

dependencies {
  minecraft "net.minecraftforge:forge:${project.property('forgehax.forge.version')}"
  forgeUniversal "net.minecraftforge:forge:${project.property('forgehax.forge.version')}:universal"

  testCompile group: 'junit', name: 'junit', version: '4.12'
  testCompile group: 'org.mockito', name: 'mockito-core', version: '2.15.0'
}

// FG 3 builds the dev Forge jar from the unversioned mcp_config 1.12.2, whose merge step lacks
// "--inject false" (see ForgeGradle#750, MergeTool#12), so the jar carries the MergeTool marker
// net.minecraftforge.fml.relauncher.Side (extra BUKKIT constant) and FML's NetworkRegistry.newChannel
// NPEs at startup. Put Forge's real Side.class ahead of it on the run classpath.
task extractForgeSide(type: Copy) {
  from { zipTree(configurations.forgeUniversal.singleFile) }
  include 'net/minecraftforge/fml/relauncher/Side.class'
  into "$buildDir/forge-side"
}

afterEvaluate {
  tasks.matching { it.name in ['runClient', 'runServer'] }.all {
    dependsOn extractForgeSide
    classpath = files("$buildDir/forge-side") + classpath
  }
}

jar {
  manifest {
    attributes(
      'FMLCorePlugin': 'com.matt.forgehax.asm.ForgeHaxCoreMod',
      'FMLCorePluginContainsFMLMod': 'true'
    )
  }
}

jar.finalizedBy('reobfJar')

processResources {
  // this will ensure that this task is redone when the versions change.
  inputs.property "version", project.version
  inputs.property "mcversion", project.property('forgehax.mc.version')

  // replace stuff in mcmod.info, nothing else
  from(sourceSets.main.resources.srcDirs) {
    include 'mcmod.info'

    // replace version and mcversion
    expand 'version': project.version, 'mcversion': project.property('forgehax.mc.version')
  }

  // copy everything else, thats not the mcmod.info
  from(sourceSets.main.resources.srcDirs) {
    exclude 'mcmod.info'
  }

  filesMatching('**/*.properties') {
    it.filter ReplaceTokens, tokens: [
      "forgehax.version"      : project.property("forgehax.version"),
      "forgehax.mc.version"   : project.property("forgehax.mc.version"),
      "forgehax.forge.version": project.property("forgehax.forge.version"),
      "forgehax.mcp.version"  : project.property("forgehax.mcp.version"),
      "forgehax.mcp.channel"  : project.property("forgehax.mcp.channel"),
      "forgehax.mcp.mapping"  : project.property("forgehax.mcp.mapping")
    ]
  }
}
